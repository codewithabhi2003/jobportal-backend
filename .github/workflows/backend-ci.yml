name: Job Portal Backend CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest

    steps:
      # 📥 Get code
      - name: Checkout code
        uses: actions/checkout@v3

      # 🧠 Setup Node
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 18

      # 📦 Install dependencies
      - name: Install dependencies
        run: npm ci

      # 🔍 Check syntax (all JS files)
      - name: Check syntax
        run: |
          find . -name "*.js" ! -path "*/node_modules/*" -exec node --check {} \;

      # 🧠 Check backend loads safely (NO DB, NO server start)
      - name: Check backend loads
        env:
          NODE_ENV: test
        run: |
          node -e "import('./index.js').then(() => console.log('✅ Backend loaded successfully')).catch(err => { console.error(err); process.exit(1); })"